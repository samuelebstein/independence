[package]
name = "independence-memory"
version = "0.1.0"
edition = "2024"
description = "Small local SQLite and FTS5 memory store for Rust applications"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "modern_sqlite"] }
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
