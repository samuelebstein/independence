[package]
name = "independence"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
cpal = "0.18.2"
crossterm = "0.29.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "metrics"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "tracing", "wav"] }
rubato = "5.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
v4l = "0.14.0"
whisper-rs = "0.16.0"

[dev-dependencies]
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["testing"] }
tempfile = "3.27.0"
wiremock = "0.6.5"
